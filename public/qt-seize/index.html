<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=q-logo-tab-v3" />
  <title>QT Seize</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #667085;
      --border: #d9dde5;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .status { color: var(--muted); font-size: 13px; text-align: right; }
    main {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      min-height: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .controls {
      padding: 16px;
      display: grid;
      gap: 14px;
      align-content: start;
    }
    .drop {
      min-height: 230px;
      border: 2px dashed #b9c2d0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      background: #fbfcfd;
    }
    .drop.dragging { border-color: var(--accent); background: #ecfdf9; }
    .drop strong { display: block; font-size: 18px; margin-bottom: 8px; }
    .drop span, .note { color: var(--muted); font-size: 13px; line-height: 1.45; }
    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 11px;
      font: inherit;
      color: var(--ink);
    }
    label {
      display: grid;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      color: #475467;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      border: 1px solid transparent;
      border-radius: 8px;
      min-height: 42px;
      padding: 10px 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-dark); }
    .secondary { background: #fff; border-color: var(--border); color: #344054; }
    .stage {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }
    .preview {
      min-height: 430px;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        linear-gradient(45deg, #eef1f5 25%, transparent 25%),
        linear-gradient(-45deg, #eef1f5 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eef1f5 75%),
        linear-gradient(-45deg, transparent 75%, #eef1f5 75%);
      background-size: 26px 26px;
      background-position: 0 0, 0 13px, 13px -13px, -13px 0;
    }
    .preview img {
      width: min(100%, 1100px);
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #101828;
      box-shadow: 0 12px 28px rgba(16, 24, 40, .18);
    }
    .empty {
      width: min(100%, 780px);
      aspect-ratio: 16 / 9;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(255,255,255,.74);
      text-align: center;
      padding: 20px;
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      background: #fff;
    }
    .error { color: var(--danger); }
    @media (max-width: 900px) {
      header, main { padding: 14px; }
      main { grid-template-columns: 1fr; }
      .status { text-align: left; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>QT Seize</h1>
      <div class="status" id="status">Portrait image to AI-filled 1920 x 1080.</div>
    </header>
    <main>
      <section class="panel controls">
        <div class="drop" id="drop">
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          <div>
            <strong>Drop one portrait image</strong>
            <span>PNG, JPG, or WebP. QT Seize will keep the subject and generate the missing wide frame.</span>
          </div>
        </div>
        <label>Generation direction
          <textarea id="prompt">Extend this portrait photo into a realistic 16:9 landscape frame. Preserve the original person, product, lighting, camera angle, and visual style. Generate only the missing left and right areas naturally.</textarea>
        </label>
        <div class="actions">
          <button class="primary" id="generate" type="button" disabled>Generate</button>
          <button class="secondary" id="download" type="button" disabled>Download</button>
        </div>
        <button class="secondary" id="reset" type="button">Reset</button>
        <div class="note" id="details">Output is always normalized to 1920 x 1080 PNG.</div>
      </section>
      <section class="panel stage">
        <div class="preview" id="preview"><div class="empty">Upload a portrait image to start.</div></div>
        <div class="meta"><span id="sourceMeta">No source selected</span><span id="outputMeta">1920 x 1080 PNG</span></div>
      </section>
    </main>
  </div>
  <script>
    const TARGET_W = 1920;
    const TARGET_H = 1080;
    const state = { file: null, sourceUrl: '', resultUrl: '' };
    const fileInput = document.getElementById('file');
    const drop = document.getElementById('drop');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const sourceMeta = document.getElementById('sourceMeta');
    const generateBtn = document.getElementById('generate');
    const downloadBtn = document.getElementById('download');

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.classList.toggle('error', !!isError);
    }

    function loadImageFromUrl(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Could not load image.'));
        img.src = url;
      });
    }

    function canvasToDataUrl(canvas) {
      return canvas.toDataURL('image/png');
    }

    async function prepareCanvases(file) {
      const url = URL.createObjectURL(file);
      const img = await loadImageFromUrl(url);
      URL.revokeObjectURL(url);
      const scale = Math.min(TARGET_H / img.naturalHeight, TARGET_W / img.naturalWidth);
      const drawW = Math.round(img.naturalWidth * scale);
      const drawH = Math.round(img.naturalHeight * scale);
      const x = Math.round((TARGET_W - drawW) / 2);
      const y = Math.round((TARGET_H - drawH) / 2);

      const imageCanvas = document.createElement('canvas');
      imageCanvas.width = TARGET_W;
      imageCanvas.height = TARGET_H;
      const imageCtx = imageCanvas.getContext('2d');
      imageCtx.clearRect(0, 0, TARGET_W, TARGET_H);
      imageCtx.drawImage(img, x, y, drawW, drawH);

      const maskCanvas = document.createElement('canvas');
      maskCanvas.width = TARGET_W;
      maskCanvas.height = TARGET_H;
      const maskCtx = maskCanvas.getContext('2d');
      maskCtx.clearRect(0, 0, TARGET_W, TARGET_H);
      maskCtx.fillStyle = '#ffffff';
      maskCtx.fillRect(x, y, drawW, drawH);

      return { imageDataUrl: canvasToDataUrl(imageCanvas), maskDataUrl: canvasToDataUrl(maskCanvas), width: img.naturalWidth, height: img.naturalHeight };
    }

    async function normalizeToTarget(dataUrl) {
      const img = await loadImageFromUrl(dataUrl);
      const canvas = document.createElement('canvas');
      canvas.width = TARGET_W;
      canvas.height = TARGET_H;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      const scale = Math.max(TARGET_W / img.naturalWidth, TARGET_H / img.naturalHeight);
      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;
      ctx.drawImage(img, (TARGET_W - w) / 2, (TARGET_H - h) / 2, w, h);
      return canvasToDataUrl(canvas);
    }

    function showImage(url) {
      preview.innerHTML = '';
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'QT Seize preview';
      preview.appendChild(img);
    }

    async function selectFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      cleanup();
      state.file = file;
      state.sourceUrl = URL.createObjectURL(file);
      const img = await loadImageFromUrl(state.sourceUrl);
      showImage(state.sourceUrl);
      sourceMeta.textContent = `${file.name} - ${img.naturalWidth} x ${img.naturalHeight}`;
      generateBtn.disabled = false;
      setStatus(img.naturalHeight >= img.naturalWidth ? 'Ready to generate.' : 'Ready, but this image is not portrait.');
    }

    function cleanup() {
      if (state.sourceUrl) URL.revokeObjectURL(state.sourceUrl);
      state.file = null;
      state.sourceUrl = '';
      state.resultUrl = '';
      downloadBtn.disabled = true;
    }

    drop.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', event => selectFile(event.target.files[0]));
    drop.addEventListener('dragover', event => {
      event.preventDefault();
      drop.classList.add('dragging');
    });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
    drop.addEventListener('drop', event => {
      event.preventDefault();
      drop.classList.remove('dragging');
      selectFile(event.dataTransfer.files[0]);
    });

    generateBtn.addEventListener('click', async () => {
      if (!state.file) return;
      generateBtn.disabled = true;
      downloadBtn.disabled = true;
      setStatus('Preparing 1920 x 1080 mask...');
      try {
        const prepared = await prepareCanvases(state.file);
        setStatus('Generating missing areas with AI...');
        const response = await fetch('/api/qt-seize/outpaint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            imageDataUrl: prepared.imageDataUrl,
            maskDataUrl: prepared.maskDataUrl,
            prompt: document.getElementById('prompt').value
          })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || payload.error || 'Generation failed.');
        const finalDataUrl = await normalizeToTarget(payload.imageDataUrl);
        state.resultUrl = finalDataUrl;
        showImage(finalDataUrl);
        downloadBtn.disabled = false;
        setStatus('Done. Output is 1920 x 1080.');
      } catch (error) {
        setStatus(error.message || String(error), true);
      } finally {
        generateBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!state.resultUrl) return;
      const link = document.createElement('a');
      link.href = state.resultUrl;
      link.download = 'qt-seize-1920x1080.png';
      document.body.appendChild(link);
      link.click();
      link.remove();
    });

    document.getElementById('reset').addEventListener('click', () => {
      cleanup();
      preview.innerHTML = '<div class="empty">Upload a portrait image to start.</div>';
      sourceMeta.textContent = 'No source selected';
      generateBtn.disabled = true;
      setStatus('Portrait image to AI-filled 1920 x 1080.');
    });
  </script>
</body>
</html>
