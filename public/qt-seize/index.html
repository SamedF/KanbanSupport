<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=q-logo-tab-v3" />
  <title>QT Seize</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #667085;
      --border: #d9dde5;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .status { color: var(--muted); font-size: 13px; text-align: right; }
    main {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      min-height: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .controls {
      padding: 16px;
      display: grid;
      gap: 14px;
      align-content: start;
    }
    .drop {
      min-height: 230px;
      border: 2px dashed #b9c2d0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      background: #fbfcfd;
    }
    .drop.dragging { border-color: var(--accent); background: #ecfdf9; }
    .drop strong { display: block; font-size: 18px; margin-bottom: 8px; }
    .drop span, .note { color: var(--muted); font-size: 13px; line-height: 1.45; }
    textarea, select, input[type="number"] {
      width: 100%;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 11px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    textarea {
      min-height: 90px;
    }
    select, input[type="number"] {
      min-height: 42px;
      resize: none;
    }
    label {
      display: grid;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      color: #475467;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .resolution-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .custom-resolution { display: none; grid-template-columns: 1fr 1fr; gap: 10px; }
    .custom-resolution.open { display: grid; }
    button {
      border: 1px solid transparent;
      border-radius: 8px;
      min-height: 42px;
      padding: 10px 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-dark); }
    .secondary { background: #fff; border-color: var(--border); color: #344054; }
    .stage {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }
    .preview {
      min-height: 430px;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        linear-gradient(45deg, #eef1f5 25%, transparent 25%),
        linear-gradient(-45deg, #eef1f5 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eef1f5 75%),
        linear-gradient(-45deg, transparent 75%, #eef1f5 75%);
      background-size: 26px 26px;
      background-position: 0 0, 0 13px, 13px -13px, -13px 0;
    }
    .preview img {
      width: min(100%, 1100px);
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #101828;
      box-shadow: 0 12px 28px rgba(16, 24, 40, .18);
    }
    .empty {
      width: min(100%, 780px);
      aspect-ratio: 16 / 9;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(255,255,255,.74);
      text-align: center;
      padding: 20px;
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      background: #fff;
    }
    .error { color: var(--danger); }
    @media (max-width: 900px) {
      header, main { padding: 14px; }
      main { grid-template-columns: 1fr; }
      .status { text-align: left; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>QT Seize</h1>
      <div class="status" id="status">Portrait image to locally-filled 16:9 output.</div>
    </header>
    <main>
      <section class="panel controls">
        <div class="drop" id="drop">
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          <div>
            <strong>Drop one portrait image</strong>
            <span>PNG, JPG, or WebP. QT Seize will keep the subject and fill the missing wide frame locally.</span>
          </div>
        </div>
        <label>Background style note
          <textarea id="prompt">Local fill preserves the original image and builds a soft 16:9 background from the same photo. No API key or paid model is required.</textarea>
        </label>
        <label>Resolution
          <select id="resolution">
            <option value="1920x1080">Full HD - 1920 x 1080</option>
            <option value="2560x1440">QHD - 2560 x 1440</option>
            <option value="3840x2160">4K UHD - 3840 x 2160</option>
            <option value="1280x720">HD - 1280 x 720</option>
            <option value="1080x1080">Square - 1080 x 1080</option>
            <option value="1080x1920">Story - 1080 x 1920</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <div class="custom-resolution" id="custom-resolution">
          <label>Width
            <input id="custom-width" type="number" min="256" max="7680" step="1" value="1920" />
          </label>
          <label>Height
            <input id="custom-height" type="number" min="256" max="7680" step="1" value="1080" />
          </label>
        </div>
        <div class="actions">
          <button class="primary" id="generate" type="button" disabled>Generate</button>
          <button class="secondary" id="download" type="button" disabled>Download</button>
        </div>
        <button class="secondary" id="reset" type="button">Reset</button>
        <div class="note" id="details">Output is generated and resized locally as PNG.</div>
      </section>
      <section class="panel stage">
        <div class="preview" id="preview"><div class="empty">Upload a portrait image to start.</div></div>
        <div class="meta"><span id="sourceMeta">No source selected</span><span id="outputMeta">1920 x 1080 PNG</span></div>
      </section>
    </main>
  </div>
  <script>
    const state = { file: null, sourceUrl: '', resultUrl: '' };
    const fileInput = document.getElementById('file');
    const drop = document.getElementById('drop');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const sourceMeta = document.getElementById('sourceMeta');
    const outputMeta = document.getElementById('outputMeta');
    const generateBtn = document.getElementById('generate');
    const downloadBtn = document.getElementById('download');
    const resolutionSelect = document.getElementById('resolution');
    const customResolution = document.getElementById('custom-resolution');
    const customWidth = document.getElementById('custom-width');
    const customHeight = document.getElementById('custom-height');

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.classList.toggle('error', !!isError);
    }

    function loadImageFromUrl(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Could not load image.'));
        img.src = url;
      });
    }

    function canvasToDataUrl(canvas) {
      return canvas.toDataURL('image/png');
    }

    function getTargetSize() {
      if (resolutionSelect.value === 'custom') {
        const width = Math.round(Number(customWidth.value || 0));
        const height = Math.round(Number(customHeight.value || 0));
        if (!Number.isFinite(width) || !Number.isFinite(height) || width < 256 || height < 256 || width > 7680 || height > 7680) {
          throw new Error('Choose a resolution between 256 and 7680 pixels per side.');
        }
        return { width, height };
      }
      const [width, height] = resolutionSelect.value.split('x').map(Number);
      return { width, height };
    }

    function updateOutputMeta() {
      try {
        const target = getTargetSize();
        outputMeta.textContent = `${target.width} x ${target.height} PNG`;
        preview.style.setProperty('--preview-aspect', `${target.width} / ${target.height}`);
      } catch (_) {
        outputMeta.textContent = 'Custom PNG';
      }
      customResolution.classList.toggle('open', resolutionSelect.value === 'custom');
    }

    function makeCanvas(width, height) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      return { canvas, ctx };
    }

    function drawCover(ctx, img, width, height) {
      const scale = Math.max(width / img.naturalWidth, height / img.naturalHeight);
      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;
      ctx.drawImage(img, (width - w) / 2, (height - h) / 2, w, h);
    }

    function resizeCanvasHighQuality(sourceCanvas, width, height) {
      let current = sourceCanvas;
      while (current.width * 0.5 > width && current.height * 0.5 > height) {
        const next = makeCanvas(Math.max(width, Math.round(current.width * 0.5)), Math.max(height, Math.round(current.height * 0.5)));
        next.ctx.drawImage(current, 0, 0, next.canvas.width, next.canvas.height);
        current = next.canvas;
      }
      if (current.width === width && current.height === height) return current;
      const finalCanvas = makeCanvas(width, height);
      finalCanvas.ctx.drawImage(current, 0, 0, width, height);
      return finalCanvas.canvas;
    }

    async function prepareCanvases(file, target) {
      const url = URL.createObjectURL(file);
      const img = await loadImageFromUrl(url);
      URL.revokeObjectURL(url);
      const scale = Math.min(target.height / img.naturalHeight, target.width / img.naturalWidth);
      const drawW = Math.round(img.naturalWidth * scale);
      const drawH = Math.round(img.naturalHeight * scale);
      const x = Math.round((target.width - drawW) / 2);
      const y = Math.round((target.height - drawH) / 2);

      const { canvas: imageCanvas, ctx: imageCtx } = makeCanvas(target.width, target.height);
      imageCtx.clearRect(0, 0, target.width, target.height);
      imageCtx.drawImage(img, x, y, drawW, drawH);

      const { canvas: maskCanvas, ctx: maskCtx } = makeCanvas(target.width, target.height);
      maskCtx.clearRect(0, 0, target.width, target.height);
      maskCtx.fillStyle = '#ffffff';
      maskCtx.fillRect(x, y, drawW, drawH);

      return { imageDataUrl: canvasToDataUrl(imageCanvas), maskDataUrl: canvasToDataUrl(maskCanvas), width: img.naturalWidth, height: img.naturalHeight };
    }

    async function normalizeToTarget(dataUrl, target) {
      const img = await loadImageFromUrl(dataUrl);
      const { canvas, ctx } = makeCanvas(target.width, target.height);
      const scale = Math.max(target.width / img.naturalWidth, target.height / img.naturalHeight);
      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;
      ctx.drawImage(img, (target.width - w) / 2, (target.height - h) / 2, w, h);
      return canvasToDataUrl(canvas);
    }

    async function generateLocalOutpaint(file, target) {
      const url = URL.createObjectURL(file);
      try {
        const img = await loadImageFromUrl(url);
        const workScale = target.width < 1600 && target.height < 1000 ? 2 : 1;
        const workW = target.width * workScale;
        const workH = target.height * workScale;
        const { canvas, ctx } = makeCanvas(workW, workH);

        const blur = Math.max(18, Math.round(Math.min(workW, workH) * .032));
        ctx.filter = `blur(${blur}px) saturate(1.08) brightness(.98)`;
        drawCover(ctx, img, workW, workH);
        ctx.filter = 'none';

        const overlay = ctx.createLinearGradient(0, 0, workW, 0);
        overlay.addColorStop(0, 'rgba(17,24,39,.16)');
        overlay.addColorStop(.32, 'rgba(17,24,39,.03)');
        overlay.addColorStop(.68, 'rgba(17,24,39,.03)');
        overlay.addColorStop(1, 'rgba(17,24,39,.16)');
        ctx.fillStyle = overlay;
        ctx.fillRect(0, 0, workW, workH);

        const fgScale = Math.min(workH / img.naturalHeight, workW / img.naturalWidth);
        const fgW = Math.round(img.naturalWidth * fgScale);
        const fgH = Math.round(img.naturalHeight * fgScale);
        const x = Math.round((workW - fgW) / 2);
        const y = Math.round((workH - fgH) / 2);

        const feather = Math.max(24, Math.round(Math.min(fgW, fgH) * .035));
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, fgW, fgH);
        ctx.clip();
        ctx.drawImage(img, x, y, fgW, fgH);

        ctx.globalCompositeOperation = 'destination-in';
        const alpha = ctx.createLinearGradient(x, 0, x + fgW, 0);
        alpha.addColorStop(0, 'rgba(0,0,0,0)');
        alpha.addColorStop(feather / fgW, 'rgba(0,0,0,1)');
        alpha.addColorStop(1 - feather / fgW, 'rgba(0,0,0,1)');
        alpha.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = alpha;
        ctx.fillRect(x, y, fgW, fgH);
        ctx.restore();

        const finalCanvas = resizeCanvasHighQuality(canvas, target.width, target.height);
        return canvasToDataUrl(finalCanvas);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function showImage(url) {
      preview.innerHTML = '';
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'QT Seize preview';
      try {
        const target = getTargetSize();
        img.style.aspectRatio = `${target.width} / ${target.height}`;
      } catch (_) {}
      preview.appendChild(img);
    }

    async function selectFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      cleanup();
      state.file = file;
      state.sourceUrl = URL.createObjectURL(file);
      const img = await loadImageFromUrl(state.sourceUrl);
      showImage(state.sourceUrl);
      sourceMeta.textContent = `${file.name} - ${img.naturalWidth} x ${img.naturalHeight}`;
      generateBtn.disabled = false;
      updateOutputMeta();
      setStatus(img.naturalHeight >= img.naturalWidth ? 'Ready to generate.' : 'Ready, but this image is not portrait.');
    }

    function cleanup() {
      if (state.sourceUrl) URL.revokeObjectURL(state.sourceUrl);
      state.file = null;
      state.sourceUrl = '';
      state.resultUrl = '';
      downloadBtn.disabled = true;
    }

    drop.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', event => selectFile(event.target.files[0]));
    drop.addEventListener('dragover', event => {
      event.preventDefault();
      drop.classList.add('dragging');
    });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
    drop.addEventListener('drop', event => {
      event.preventDefault();
      drop.classList.remove('dragging');
      selectFile(event.dataTransfer.files[0]);
    });
    resolutionSelect.addEventListener('change', updateOutputMeta);
    customWidth.addEventListener('input', updateOutputMeta);
    customHeight.addEventListener('input', updateOutputMeta);

    generateBtn.addEventListener('click', async () => {
      if (!state.file) return;
      generateBtn.disabled = true;
      downloadBtn.disabled = true;
      try {
        const target = getTargetSize();
        setStatus(`Preparing ${target.width} x ${target.height} canvas...`);
        await prepareCanvases(state.file, target);
        setStatus('Filling and resizing locally...');
        const finalDataUrl = await generateLocalOutpaint(state.file, target);
        state.resultUrl = finalDataUrl;
        showImage(finalDataUrl);
        downloadBtn.disabled = false;
        setStatus(`Done. Output is ${target.width} x ${target.height}.`);
      } catch (error) {
        setStatus(error.message || String(error), true);
      } finally {
        generateBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!state.resultUrl) return;
      const link = document.createElement('a');
      const target = getTargetSize();
      link.href = state.resultUrl;
      link.download = `qt-seize-${target.width}x${target.height}.png`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    });

    document.getElementById('reset').addEventListener('click', () => {
      cleanup();
      preview.innerHTML = '<div class="empty">Upload a portrait image to start.</div>';
      sourceMeta.textContent = 'No source selected';
      generateBtn.disabled = true;
      updateOutputMeta();
      setStatus('Portrait image to locally-filled output.');
    });
    updateOutputMeta();
  </script>
</body>
</html>
